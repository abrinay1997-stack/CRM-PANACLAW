name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # public/admin.css se versiona (wrangler sube public/ sin construir nada),
      # así que aquí se comprueba que lo commiteado sea lo que produce el código.
      - run: pnpm css:check
      - run: pnpm icons:check
      - run: pnpm test
